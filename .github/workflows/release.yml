name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing semver release tag
        default: ''
        required: false
        type: string
      canary_sha:
        description: Current main commit SHA for a non-publishing signing canary
        default: ''
        required: false
        type: string
      publish_release:
        description: Publish verified candidates to the GitHub Release
        default: false
        required: true
        type: boolean
permissions:
  actions: read
  contents: write
concurrency:
  group: caller-release-${{ github.repository }}-${{ inputs.canary_sha != '' && inputs.canary_sha || inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-release-signed.yml@e6357cc6fb863b3691a9fe3203c54fe74bdec74c
    with:
      product_name: NullSpine
      tag_name: ${{ inputs.tag_name }}
      canary_sha: ${{ inputs.canary_sha }}
      publish_release: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
