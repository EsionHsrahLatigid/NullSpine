name: Release
on:
  push:
    tags: ["v*"]
permissions:
  actions: read
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-release.yml@d7746cba582c0a00e6e7f0cdc37ae3b2d38830d8
    with:
      product_name: NullSpine
